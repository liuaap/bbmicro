<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>搜尋結果｜MedLink 醫鏈</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell search-page">
    <header class="search-header">
      <a class="back-link" href="index.html">‹</a>
      <div class="search-input">植牙</div>
      <button type="button">篩選</button>
    </header>

    <section class="result-summary">
      <p class="eyebrow">搜尋結果</p>
      <h1>找到 56 位植牙醫師、42 間診所</h1>
      <p>依目前位置 5 km 內排序，優先顯示今日可約與評價較高的結果。</p>
    </section>

    <section class="filter-chips">
      <span class="chip active">全部</span>
      <span class="chip">今日可約</span>
      <span class="chip">價格區間</span>
      <span class="chip">植牙材質</span>
      <span class="chip">設備</span>
    </section>

    <section class="insight-card">
      <h2>植牙關鍵資訊</h2>
      <div class="insight-grid">
        <div><strong>價格</strong><span>單顆約 6–12 萬</span></div>
        <div><strong>材質</strong><span>鈦金屬、全瓷冠</span></div>
        <div><strong>設備</strong><span>3D 斷層、導引手術</span></div>
      </div>
    </section>

    <section class="section-head">
      <h2>推薦結果</h2>
      <button>距離優先</button>
    </section>

    <section class="result-list" id="resultList"></section>

    <nav class="tabbar">
      <a href="index.html">首頁</a>
      <a>我的預約</a>
      <a>通知</a>
      <a>帳號</a>
    </nav>
  </main>
  <script src="search.js"></script>
</body>
</html>
